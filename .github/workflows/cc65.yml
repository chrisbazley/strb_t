name: cc65

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.configuration }} (${{ matrix.language_mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        configuration: [freestanding, static]
        language_mode: [c99, cc65]

    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: |
          sudo apt-get update
          sudo apt-get install --yes cc65
          cl65 --version

      - name: Compile and link the tests
        shell: bash
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          LANGUAGE_MODE: ${{ matrix.language_mode }}
        run: |
          mkdir -p build-cc65
          case "$CONFIGURATION" in
            freestanding) definition=STRB_FREESTANDING=1 ;;
            static) definition=STRB_STATIC_ALLOC=1 ;;
          esac
          # The position-bound assertions are constant for some field widths.
          # Keep assertions enabled while treating other warnings as errors.
          cl65 -t sim6502 --standard "$LANGUAGE_MODE" -W error -W -const-comparison \
            -D"$definition" -I. -c -o build-cc65/strb.o strb.c
          ar65 r build-cc65/strb.lib build-cc65/strb.o
          cl65 -t sim6502 --standard "$LANGUAGE_MODE" -W error -W -const-comparison \
            -D"$definition" -I. -c -o build-cc65/test.o test.c
          cl65 -t sim6502 -o build-cc65/test build-cc65/test.o build-cc65/strb.lib

      - name: Run the tests in sim65
        run: timeout 60 sim65 build-cc65/test
