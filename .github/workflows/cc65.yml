name: cc65

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        configuration: [freestanding]

    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: |
          sudo apt-get update
          sudo apt-get install --yes cc65
          cl65 --version

      - name: Compile and link the tests
        shell: bash
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          mkdir -p build-cc65
          sources=(
            strb_core.c strb_external.c strb_strnlen.c
            strb_mode.c strb_pos.c strb_error.c
            strb_write.c strb_split.c strb_delto.c strb_unputc.c
            strb_puts.c strb_putc.c
          )
          case "$CONFIGURATION" in
            freestanding)
              definition=STRB_FREESTANDING=1
              ;;
          esac
          # The position-bound assertions are constant for some field widths.
          # Keep assertions enabled while treating other warnings as errors.
          for source in "${sources[@]}"; do
            object="build-cc65/${source%.c}.o"
            cl65 -t sim6502 --standard cc65 -W error -W -const-comparison \
              -D"$definition" -I. -c -o "$object" "$source"
            ar65 r build-cc65/strb.lib "$object"
          done
          cl65 -t sim6502 --standard cc65 -W error -W -const-comparison \
            -D"$definition" -I. -c -o build-cc65/test.o test.c
          cl65 -t sim6502 -o build-cc65/test build-cc65/test.o build-cc65/strb.lib

      - name: Run the tests in sim65
        run: timeout 60 sim65 build-cc65/test
