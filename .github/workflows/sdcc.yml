name: SDCC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  freestanding:
    name: Z80 freestanding with _Optional
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download SDCC trunk r17089
        shell: bash
        run: |
          archive="$RUNNER_TEMP/sdcc.tar.bz2"
          curl --fail --location --retry 3 --max-time 180 \
            https://downloads.sourceforge.net/project/sdcc/snapshot_builds/amd64-unknown-linux2.5/sdcc-snapshot-amd64-unknown-linux2.5-20261025-17089-cf-x86.tar.bz2 \
            --output "$archive"
          echo "19b90b14579d3cb7394bfe2513382f899c40e45de35ca630298683ff806b3ed0  $archive" | sha256sum --check
          tar --no-same-owner -xjf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sdcc/bin" >> "$GITHUB_PATH"

      - name: Compile and link the freestanding tests
        shell: bash
        run: |
          sdcc --version
          mkdir -p build-sdcc
          # SDCC warns about constant assertion conditions; keep warnings non-fatal.
          flags=(-mz80 --std-c99 -DSTRB_FREESTANDING=1 -I.)
          sdcc "${flags[@]}" -c strb_core.c -o build-sdcc/core.rel
          sdcc "${flags[@]}" -c strb_fixed.c -o build-sdcc/fixed.rel
          # Warning 110 reports optimizer changes to control flow in assertions.
          sdcc "${flags[@]}" --disable-warning 110 -Dmain=strb_test_main -c test.c -o build-sdcc/test.rel
          sdcc "${flags[@]}" -c tests/sdcc-runtime.c -o build-sdcc/runtime.rel
          sdcc -mz80 build-sdcc/core.rel build-sdcc/fixed.rel \
            build-sdcc/test.rel build-sdcc/runtime.rel -o build-sdcc/test.ihx

      - name: Run the tests in uCsim
        shell: bash
        run: |
          printf 'run\nquit\n' | timeout 60 ucsim_z80 -t Z80 -q -c - \
            -I "if=rom[0xff00],out=build-sdcc/test-output.log" \
            build-sdcc/test.ihx > build-sdcc/simulator.log 2>&1
          cat build-sdcc/test-output.log
          grep -Fx 'STRB TEST PASS' build-sdcc/test-output.log
