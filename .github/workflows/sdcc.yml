name: SDCC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  freestanding:
    name: Z80 freestanding with _Optional
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: chrisbazley/strb_t/.github/actions/setup-sdcc@sdcc-toolchain

      - name: Compile and link the freestanding tests
        shell: bash
        run: |
          sdcc --version
          mkdir -p build-sdcc
          # SDCC warns about constant assertion conditions; keep warnings non-fatal.
          flags=(-mz80 --std-c99 --enable-warning 378 -DSTRB_FREESTANDING=1 -I.)
          sources=(
            strb_core.c strb_external.c strb_strnlen.c
            strb_mode.c strb_pos.c strb_error.c
            strb_write.c strb_split.c strb_delto.c strb_unputc.c
            strb_puts.c strb_putc.c
          )
          objects=()
          for source in "${sources[@]}"; do
            object="build-sdcc/${source%.c}.rel"
            sdcc "${flags[@]}" -c "$source" -o "$object"
            objects+=("$object")
          done
          # Warning 110 reports optimizer changes to control flow in assertions.
          sdcc "${flags[@]}" --disable-warning 110 -Dmain=strb_test_main -c test.c -o build-sdcc/test.rel
          sdcc "${flags[@]}" -c tests/sdcc-runtime.c -o build-sdcc/runtime.rel
          sdcc -mz80 "${objects[@]}" \
            build-sdcc/test.rel build-sdcc/runtime.rel -o build-sdcc/test.ihx

      - name: Run the tests in uCsim
        shell: bash
        run: |
          status=0
          printf 'run\nquit\n' | timeout 60 ucsim_z80 -t Z80 -q -c - \
            -I "if=rom[0xff00],out=build-sdcc/test-output.log" \
            build-sdcc/test.ihx > build-sdcc/simulator.log 2>&1 || status=$?
          cat build-sdcc/test-output.log
          if test "$status" -ne 0; then
            cat build-sdcc/simulator.log
            exit "$status"
          fi
          grep -Fx 'STRB TEST PASS' build-sdcc/test-output.log
