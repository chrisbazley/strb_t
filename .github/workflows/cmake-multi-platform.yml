# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release, Debug]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DWARNINGS_AS_ERRORS=ON
        -DUSE_FORTIFY=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

  optional-clang:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    name: _Optional Clang ${{ matrix.build_type }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      OPTIONAL_CLANG_TAG: v1.0.14-optional
      OPTIONAL_CLANG_PLATFORM: linux-x86_64
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download _Optional Clang
        shell: bash
        run: |
          archive="clang+llvm-${OPTIONAL_CLANG_TAG}-${OPTIONAL_CLANG_PLATFORM}.tar.xz"
          toolchain="$RUNNER_TEMP/optional-clang"

          mkdir -p "$toolchain"

          gh release download "$OPTIONAL_CLANG_TAG" \
            --repo chrisbazley/llvm-project \
            --pattern "$archive" \
            --pattern "$archive.sha256" \
            --dir "$RUNNER_TEMP"

          cd "$RUNNER_TEMP"
          sha256sum --check "$archive.sha256"
          tar -xJf "$archive" -C "$toolchain"

          echo "OPTIONAL_CLANG_ROOT=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          test "$(command -v clang)" = "$OPTIONAL_CLANG_ROOT/bin/clang"
          test "$(command -v clang-tidy)" = \
            "$OPTIONAL_CLANG_ROOT/bin/clang-tidy"

          clang --version
          clang-tidy --version

          clang-tidy \
            --list-checks \
            --checks='-*,clang-analyzer-optionality.OptionalityChecker' |
            grep -F 'clang-analyzer-optionality.OptionalityChecker'

          cat > "$RUNNER_TEMP/optional-smoke-test.c" <<'EOF'
          #include "strb.h"
          typedef void Callback(void);
          _Optional Callback *callback = NULL;
          int value_or_zero(_Optional int *value) {
            return value ? *value : 0;
          }
          EOF

          clang -std=c99 -DUSE_OPTIONAL -I. -Werror=pedantic \
            -fsyntax-only \
            "$RUNNER_TEMP/optional-smoke-test.c"

      - name: Configure with _Optional
        shell: bash
        run: |
          cmake \
            -S "$GITHUB_WORKSPACE" \
            -B "$GITHUB_WORKSPACE/build-optional" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER="$OPTIONAL_CLANG_ROOT/bin/clang" \
            -DCMAKE_C_FLAGS="-Werror=null-to-nonoptional -Werror=implicit-null-initialization" \
            -DCMAKE_CXX_COMPILER="$OPTIONAL_CLANG_ROOT/bin/clang++" \
            -DCMAKE_CXX_FLAGS="-Werror=null-to-nonoptional -Werror=implicit-null-initialization" \
            -DCLANG_TIDY_EXE="$OPTIONAL_CLANG_ROOT/bin/clang-tidy" \
            -DWARNINGS_AS_ERRORS=ON \
            -DUSE_OPTIONAL=ON \
            -DENABLE_CLANG_TIDY=ON

      - name: Build and analyze
        shell: bash
        run: |
          cmake \
            --build "$GITHUB_WORKSPACE/build-optional" \
            --parallel 2

      - name: Test
        shell: bash
        run: |
          ctest \
            --test-dir "$GITHUB_WORKSPACE/build-optional" \
            --build-config ${{ matrix.build_type }} \
            --output-on-failure

  optional-tcc:
    name: _Optional TCC
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream TCC
        run: |
          git init -q .ci/tinycc
          git -C .ci/tinycc fetch --no-tags https://repo.or.cz/tinycc.git refs/heads/mob
          git -C .ci/tinycc checkout -q --detach 205f264b9e01b47d18f9182e4009eadfc4019219
      - name: Build TCC
        working-directory: .ci/tinycc
        run: |
          ./configure --prefix="$RUNNER_TEMP/tcc"
          make -j2
          make install
      - name: Check NULL conversions
        run: |
          cat > "$RUNNER_TEMP/check-null.c" <<'EOF'
          #include "strb.h"
          #ifdef REQUIRED
          int *pi = NULL;
          #else
          _Optional int *poi = NULL;
          #endif
          EOF
          tcc="$RUNNER_TEMP/tcc/bin/tcc"
          src="$RUNNER_TEMP/check-null.c"
          "$tcc" -I. -DUSE_OPTIONAL -Werror=null-to-nonoptional -c "$src" -o "$RUNNER_TEMP/check-null.o"
          if "$tcc" -I. -DUSE_OPTIONAL -Werror=null-to-nonoptional -DREQUIRED -c "$src" -o "$RUNNER_TEMP/check-null.o" 2>"$RUNNER_TEMP/check-null.log"; then
            echo 'TCC accepted int *pi = NULL' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/check-null.log"
          grep -F 'non-optional target type' "$RUNNER_TEMP/check-null.log"
      - name: Configure with _Optional
        run: cmake -S . -B build-tcc -DCMAKE_C_FLAGS=-Werror=null-to-nonoptional -DCMAKE_C_COMPILER="$RUNNER_TEMP/tcc/bin/tcc" -DUSE_OPTIONAL=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-tcc --parallel 2
      - name: Test
        run: ctest --test-dir build-tcc --no-tests=error --output-on-failure
